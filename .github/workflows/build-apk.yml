name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hajimi
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        working-directory: .
        run: unzip -q hajimi.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick jq

      - name: Install npm deps
        run: npm install

      - name: Copy three.js into www
        run: node scripts/copy-libs.mjs

      - name: Download CC0 textures from Poly Haven
        run: bash scripts/fetch-textures.sh

      - name: Add Android platform
        run: npx cap add android

      - name: Icons / landscape / fullscreen
        run: bash scripts/make-android.sh

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: hajimi/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hajimi-apk
          path: hajimi/android/app/build/outputs/apk/debug/app-debug.apk
